<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — BabiPlay CI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0e;--bg2:#111116;--bg3:#18181f;--bg4:#1e1e28;--border:#2a2a36;--border2:#363644;--text:#e8e8f0;--muted:#5a5a78;--muted2:#8888aa;--gold:#f5a623;--gold2:#ffbe55;--r:10px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

nav{position:sticky;top:0;z-index:100;background:rgba(11,11,14,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;background:linear-gradient(100deg,#f5a623,#ff7f50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);color:var(--muted2);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none;transition:all .2s;font-family:'DM Sans',sans-serif}
.back-btn:hover{color:var(--text);border-color:var(--border2)}

/* HERO */
.hero{position:relative;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
@media(min-width:700px){.hero{padding:22px 40px 18px}}
.hero-content{max-width:1100px;margin:0 auto}
.hero-plat{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:4px;margin-bottom:10px;text-transform:uppercase}
.hero-title{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px}
@media(min-width:700px){.hero-title{font-size:38px}}
.hero-meta{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* LAYOUT — grille à zones nommées : sur mobile l'ordre visuel est galerie → achat → infos
   (le client voit une vraie grande image, peut acheter tout de suite, puis descend s'il veut
   en savoir plus). Sur grand écran, la colonne achat reste fixe à droite pendant que la
   galerie et les infos défilent à gauche. */
.product-layout{
  max-width:1100px;margin:0 auto;padding:16px;
  display:grid;gap:14px;
  grid-template-columns:1fr;
  grid-template-areas:"galerie" "achat" "infos";
}
.layout-galerie{grid-area:galerie}
.layout-achat{grid-area:achat}
.layout-infos{grid-area:infos;display:flex;flex-direction:column;gap:14px}
@media(min-width:900px){
  .product-layout{
    grid-template-columns:1fr 300px;
    grid-template-areas:"galerie achat" "infos achat";
    align-items:start;
  }
}

/* GALERIE */
.gallery-main{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f4f4f6;border-radius:14px;border:1px solid var(--border)}
.gallery-fb{width:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:60px}
.fb-psn{background:linear-gradient(140deg,#001a50,#0057b8)}
.fb-xbox{background:linear-gradient(140deg,#0a3d0a,#107c10)}
.fb-pc{background:linear-gradient(140deg,#0d1520,#2a475e)}
.fb-nintendo{background:linear-gradient(140deg,#8b0009,#e60012)}
.fb-streaming{background:linear-gradient(140deg,#2a1050,#a970ff)}
.fb-materiel{background:linear-gradient(140deg,#2b1c00,#ffb020)}

/* INFOS PRODUIT */
.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px}
.info-box h3{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.info-desc{font-size:13px;color:var(--muted2);line-height:1.7}

/* CE QUE VOUS ACHETEZ — bloc en français, indépendant de la description d'origine
   (souvent en anglais, parfois absente) */
.achat-type{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:6px;text-transform:uppercase;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.45);color:var(--gold);margin-bottom:12px}
.achat-points{list-style:none;display:flex;flex-direction:column;gap:9px}
.achat-points li{font-size:13px;color:var(--muted2);line-height:1.6;display:flex;gap:9px;align-items:flex-start}
.achat-points li::before{content:'▪';color:var(--gold);flex-shrink:0;line-height:1.4}
.mentions{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.65}

/* ACTIVATION STEPS */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:flex-start;gap:12px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#000;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-content h4{font-size:13px;font-weight:600;margin-bottom:2px}
.step-content p{font-size:12px;color:var(--muted2);line-height:1.5}

/* TABS ACTIVATION */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--bg3);border:1px solid var(--border);color:var(--muted2);padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.tab.active{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.08)}

/* TABLEAU D'INFOS (façon Instant Gaming) */
.specs-table{width:100%;border-collapse:collapse}
.specs-table tr{border-bottom:1px solid var(--border)}
.specs-table tr:last-child{border-bottom:none}
.specs-table td{padding:9px 0;font-size:13px;vertical-align:top}
.specs-table td:first-child{color:var(--muted2);width:42%;padding-right:12px}
.specs-table td:last-child{color:var(--text);font-weight:500}

/* GALERIE / VIDÉO */
.gallery-yt-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#000}
.gallery-yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gallery-thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.gallery-thumb{width:64px;height:64px;flex-shrink:0;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;opacity:.6;transition:all .2s}
.gallery-thumb:hover{opacity:.85}
.gallery-thumb.active{border-color:var(--gold);opacity:1}

/* AUTRES ÉDITIONS : réutilise .sim-card / .sim-grid, définis plus bas */

/* COLONNE DROITE — ACHAT */
.buy-box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:72px}
@media(min-width:900px){.buy-box{min-width:280px;max-width:300px}}
.buy-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f4f4f6;border-radius:10px;margin-bottom:4px}
.buy-img-fb{width:100%;aspect-ratio:16/9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px}
.buy-name{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;line-height:1.3}
.buy-type{font-size:12px;color:var(--gold);font-weight:600}
.buy-price{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;color:var(--gold);line-height:1}
.buy-promo{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.buy-promo s{color:var(--muted2);font-size:15px}
.buy-promo span{background:#ff3b30;color:#fff;font-weight:800;font-size:12px;padding:2px 8px;border-radius:5px}
.buy-chrono{margin-top:8px;font-size:13px;color:#ff7a50;font-weight:600}
.buy-price small{display:block;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--muted2);font-weight:400}
.buy-stock{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:5px}
.buy-stock-dot{width:7px;height:7px;border-radius:50%;background:#52b043;flex-shrink:0}
.btn-add{width:100%;background:linear-gradient(100deg,#f5a623,#ff8c00);border:none;color:#000;padding:14px;border-radius:12px;font-size:16px;font-weight:700;font-family:'Rajdhani',sans-serif;letter-spacing:1px;cursor:pointer;transition:opacity .2s}
.btn-add:active{opacity:.85}
.buy-perks{display:flex;flex-direction:column;gap:7px}
.perk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2)}
.perk-icon{font-size:16px;flex-shrink:0}

/* SIMILAIRES */
.sim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:500px){.sim-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.sim-grid{grid-template-columns:repeat(4,1fr)}}
.sim-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;display:block;color:var(--text);transition:border-color .2s}
.sim-card:hover{border-color:var(--gold)}
.sim-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.sim-card-fb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:24px}
.sim-info{padding:8px 10px}
.sim-name{font-size:12px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-price{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--gold)}

.section-title{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;margin-bottom:14px;padding:0 16px}
@media(min-width:900px){.section-title{padding:0}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--gold);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s ease;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#52b043}

.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<nav>
  <a class="back-btn" href="index.html" onclick="if(document.referrer && document.referrer.includes(location.host) && history.length>1){history.back();return false;}">← Retour</a>
  <a class="logo" href="index.html">BabiPlay</a>
</nav>

<div id="page-content">
  <!-- Chargement skeleton -->
  <div style="padding:20px 16px;display:flex;flex-direction:column;gap:14px">
    <div class="skeleton" style="height:220px;border-radius:14px"></div>
    <div class="skeleton" style="height:60px;border-radius:8px;max-width:300px"></div>
    <div class="skeleton" style="height:180px;border-radius:14px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let sb, produit = null, allProducts = [];
const params = new URLSearchParams(location.search);
const prodId = params.get('id');

const fmt = n => (n || 0).toLocaleString('fr-FR');
const pEmoji = p => ({ psn:'🎮', xbox:'🕹️', pc:'🖥️', nintendo:'🔴', streaming:'📺', materiel:'🕹️' }[p] || '🎮');
const pLabel = p => ({ psn:'PlayStation', xbox:'Xbox', pc:'PC', nintendo:'Nintendo', streaming:'Streaming & Apps', materiel:'Accessoires Gaming' }[p] || p);
const pColor = p => ({ psn:'#5baeff', xbox:'#7dd670', pc:'#66c0f4', nintendo:'#ff6b6b', streaming:'#a970ff', materiel:'#ffb020' }[p] || '#f5a623');
const pFbClass = p => ({ psn:'fb-psn', xbox:'fb-xbox', pc:'fb-pc', nintendo:'fb-nintendo', streaming:'fb-streaming', materiel:'fb-materiel' }[p] || 'fb-pc');
const pBoutique = p => ({ psn:'PlayStation Store', xbox:'Microsoft Store', pc:'Steam / Epic Games', nintendo:'Nintendo eShop', streaming:'le service concerné' }[p] || 'la boutique officielle');

// Détecte un lien YouTube et le convertit en lien intégrable, en boucle et muet
function getYouTubeEmbed(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  if (!m) return null;
  const id = m[1];
  return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=1&modestbranding=1&playsinline=1&rel=0`;
}

// ---------------------------------------------------------------------------
// TYPE DE PRODUIT
// La quasi-totalité du catalogue vient de Kinguin, donc les noms sont en anglais
// ("Gift Card", "CD Key", "Membership"...). Le client ivoirien ne peut pas deviner
// s'il achète un jeu, du crédit, un abonnement ou de la monnaie de jeu. On déduit
// donc le type à partir de la sous-catégorie puis du nom, et ce type pilote à la
// fois l'encadré "Ce que vous achetez" et les étapes d'activation affichées.
// ---------------------------------------------------------------------------
// « Jeu + Pre-Order Bonus » (avec un +) = le jeu complet AVEC le bonus.
// « Jeu - Pre-Order Bonus » (avec un tiret) = le bonus seul, sans le jeu.
function estJeuPlusBonus(p) {
  const nom = (p.nom || '').toLowerCase();
  return /\s\+\s*pre-?order bonus/.test(nom) && !/\s-\s/.test(nom.split('+')[0]);
}
function dateSortieFR(p) {
  const d = p.date_sortie ? new Date(p.date_sortie) : null;
  return d && !isNaN(d) ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : null;
}

// Message unique pour TOUTES les précommandes (jeu, édition, bonus...)
function textePrecommande(p) {
  const quand = dateSortieFR(p) ? `le jour de la sortie, le <strong>${dateSortieFR(p)}</strong>` : '<strong>le jour de la sortie</strong>';
  return `🕒 <strong>Précommande</strong> : le code d'activation sera livré par email ${quand}. Dès votre paiement, vous recevez un email qui confirme votre commande.`;
}

function typeProduit(p) {
  if (p.est_physique) return 'physique';
  if (p.plateforme === 'streaming') return 'streaming';
  const sc = (p.sous_categorie || '').toLowerCase();
  const nom = (p.nom || '').toLowerCase();
  if (sc.includes('carte') || /gift card|giftcard|carte cadeau|wallet|top.?up|prepaid/.test(nom)) return 'carte';
  if (sc.includes('abonnement') || sc.includes('game pass') || /subscription|membership|game pass|playstation plus|ps plus|nintendo switch online|\b\d+\s*(month|months|mois)\b/.test(nom)) return 'abonnement';
  if (sc.includes('point') || /\bpoints\b|\bcoins\b|v-?bucks|robux|\buc\b|credits?\b|tokens?\b|fifa points|fc points/.test(nom)) return 'points';
  if (estJeuPlusBonus(p)) return 'jeu';
  if (/\bdlc\b|pre-?order bonus|season pass|expansion pass|\badd-?on\b|\bupgrade\b/.test(nom)) return 'dlc';
  return 'jeu';
}

const LIBELLE_TYPE = {
  jeu: '🎮 Jeu — clé d\'activation',
  dlc: '🧩 Contenu additionnel (DLC) — pas le jeu',
  carte: '🎁 Carte cadeau — crédit',
  abonnement: '⭐ Abonnement',
  points: '🪙 Monnaie de jeu',
  streaming: '📺 Abonnement streaming',
  physique: '📦 Produit physique',
};

// Ce que le client achète, écrit en français simple. C'est aussi ce qui permet de
// se défendre en cas de litige : le client a vu clairement ce qu'il prenait.
function pointsAchat(p, type) {
  const boutique = pBoutique(p.plateforme);
  switch (type) {
    case 'jeu': {
      const pts = [
        `Vous achetez une <strong>clé d'activation</strong> pour ce jeu, à saisir sur ${boutique}.`,
        'Une fois activée, la clé ajoute le jeu à votre compte de façon définitive. Vous le téléchargez ensuite depuis votre bibliothèque.',
      ];
      if (estJeuPlusBonus(p)) pts.push('🎁 <strong>C\'est le jeu complet</strong>, avec <strong>en plus</strong> le bonus de précommande (objets offerts dans le jeu).');
      pts.push('Ce n\'est ni une carte cadeau, ni de la monnaie de jeu : vous recevez ce jeu précis, et rien d\'autre.');
      pts.push('La clé ne s\'active qu\'une seule fois, sur un seul compte.');
      return pts;
    }
    case 'dlc': {
      const nomMin = (p.nom || '').toLowerCase();
      const pts = [
        'Vous achetez un <strong>contenu additionnel</strong> (DLC) : un bonus qui s\'ajoute à un jeu. <strong>Ce n\'est pas le jeu lui-même.</strong>',
        `⚠️ Le jeu de base doit déjà être sur votre compte ${boutique} (acheté séparément). Sans lui, ce contenu ne sert à rien.`,
      ];
      if (/pre-?order bonus/.test(nomMin)) pts.push('Il s\'agit du bonus normalement offert à ceux qui ont précommandé le jeu (tenue, arme, objets...). Vous pouvez l\'obtenir ici sans avoir précommandé.');
      if (/season pass/.test(nomMin)) pts.push('Le Season Pass donne accès aux contenus additionnels prévus pour ce jeu, au fur et à mesure de leur sortie.');
      if (/\bupgrade\b/.test(nomMin)) pts.push('Une « Upgrade » fait passer votre version du jeu à une édition supérieure : vous devez déjà posséder la version de base.');
      pts.push('La clé ne s\'active qu\'une seule fois, sur un seul compte.');
      return pts;
    }
    case 'carte': return [
      `Vous achetez un <strong>code de crédit</strong> qui alimente le porte-monnaie de votre compte ${boutique}, du montant indiqué dans le nom du produit.`,
      'Ce crédit vous sert ensuite à acheter ce que vous voulez sur la boutique officielle : jeux, extensions, abonnements.',
      'Aucun jeu n\'est inclus : la carte, c\'est de l\'argent sur votre compte, pas un jeu.',
      'Le code ne s\'utilise qu\'une seule fois.',
    ];
    case 'abonnement': return [
      'Vous achetez un <strong>abonnement</strong> pour la durée indiquée dans le nom du produit (1 mois, 3 mois, 12 mois...).',
      'L\'accès démarre à l\'activation du code et s\'arrête automatiquement à la fin de la période.',
      'Il n\'y a aucun prélèvement automatique de notre part : pour continuer, vous rachetez un code.',
      'Le code ne s\'utilise qu\'une seule fois.',
    ];
    case 'points': return [
      'Vous achetez de la <strong>monnaie interne</strong> au jeu concerné (points, coins, crédits...).',
      'Elle ne s\'utilise que dans ce jeu précis, sur le compte où vous activez le code.',
      'Ce n\'est ni le jeu lui-même, ni un crédit utilisable ailleurs sur la boutique.',
      'Le code ne s\'utilise qu\'une seule fois.',
    ];
    case 'streaming': return [
      'Vous achetez un <strong>code d\'abonnement</strong> à activer sur votre propre compte du service (Netflix, Spotify, Disney+, Crunchyroll...).',
      'Nous ne vous donnons jamais les identifiants d\'un compte partagé : vous restez propriétaire de votre compte.',
      'L\'accès dure le temps indiqué dans le nom du produit, puis s\'arrête.',
      'Le code ne s\'utilise qu\'une seule fois.',
    ];
    case 'physique': return [
      'Vous achetez un <strong>article physique</strong>, livré en main propre à Abidjan.',
      'Le délai annoncé court à partir de la validation du paiement.',
      'Vous êtes contacté(e) au numéro renseigné à la commande pour convenir de la remise.',
    ];
    default: return [];
  }
}

function mentionsLegales(type) {
  if (type === 'physique') {
    return "Article vérifié avant remise. En cas de défaut constaté à la livraison, contactez le support WhatsApp le jour même. Les frais et délais annoncés sont indicatifs et peuvent varier selon le transporteur.";
  }
  return "Code numérique à usage unique. Conformément à l'usage pour les produits numériques, un code déjà révélé ne peut être ni repris ni remboursé. Nos codes sont vérifiés avant envoi ; dans le cas rare où un code ne fonctionnerait pas, contactez le support WhatsApp sous 48 h avec votre numéro de commande : nous le remplaçons ou vous remboursons. Vérifiez la région du produit avant l'achat : un code d'une autre région peut être refusé par votre compte.";
}

// La région conditionne la validité du code. Elle est presque toujours dans le nom
// du produit (US, EU, FR, GLOBAL...). Ne rien afficher de faux ici est important :
// l'ancienne version annonçait "Europe (France incluse)" pour TOUS les produits,
// y compris les codes US.
function regionDepuisNom(nom) {
  const n = (nom || '').toUpperCase();
  if (/\bGLOBAL\b|\bWORLDWIDE\b|\bROW\b/.test(n)) return 'Mondial — valable partout';
  if (/\bUS\b|\bUSA\b|UNITED STATES|NORTH AMERICA|\bNA\b/.test(n)) return 'États-Unis — un compte US est nécessaire';
  if (/\bFR\b|FRANCE|FRENCH/.test(n)) return 'France';
  if (/\bEU\b|\bEUROPE\b|\bEEA\b/.test(n)) return 'Europe';
  if (/\bUK\b|UNITED KINGDOM|\bGB\b/.test(n)) return 'Royaume-Uni — un compte UK est nécessaire';
  if (/\bTR\b|TURKEY|TURKISH/.test(n)) return 'Turquie — un compte turc est nécessaire';
  if (/\bBR\b|BRAZIL/.test(n)) return 'Brésil — un compte brésilien est nécessaire';
  if (/\bAR\b|ARGENTINA/.test(n)) return 'Argentine — un compte argentin est nécessaire';
  if (/\bIN\b|\bINDIA\b/.test(n)) return 'Inde — un compte indien est nécessaire';
  if (/\bKR\b|KOREA/.test(n)) return 'Corée du Sud — un compte coréen est nécessaire';
  if (/\bJP\b|JAPAN/.test(n)) return 'Japon — un compte japonais est nécessaire';
  return 'Indiquée dans le nom du produit — vérifiez avant d\'acheter';
}

function etapesPour(p, type) {
  const plat = p.plateforme;
  const delai = p.delai_livraison_jours || 7;
  switch (type) {
    case 'physique': return [
      { t: 'Commande confirmée', d: 'Votre paiement est validé et votre commande est enregistrée' },
      { t: 'Préparation', d: 'Nous récupérons et préparons votre article avec soin' },
      { t: 'Expédition', d: `Livraison vers la Côte d'Ivoire — délai annoncé : ${delai} jours` },
      { t: 'Réception', d: 'Vous êtes contacté(e) pour organiser la remise du colis' },
    ];
    case 'streaming': return ETAPES_STREAMING;
    case 'points': return ETAPES_POINTS;
    case 'abonnement': return ETAPES_ABONNEMENT[plat] || ETAPES_ABONNEMENT.pc;
    case 'carte': return ETAPES_CARTE[plat] || ETAPES_CARTE.pc;
    case 'dlc': {
      const base = (ETAPES_JEU[plat] || ETAPES_JEU.pc).slice(0, -1);
      return [...base, { t: 'Lancez le jeu', d: 'Le contenu apparaît dans le jeu de base déjà installé (parfois après un petit téléchargement)' }];
    }
    default: return ETAPES_JEU[plat] || ETAPES_JEU.pc;
  }
}

// ---------------------------------------------------------------------------
// LE NOM DU PRODUIT EXPLIQUÉ — les noms Kinguin sont en anglais et pleins de
// jargon (DLC, CD Key, Pre-order Bonus, EU...). On traduit chaque terme présent.
// ---------------------------------------------------------------------------
function lexiqueNom(p) {
  const n = ' ' + (p.nom || '').toLowerCase() + ' ';
  const L = [];
  const a = (test, terme, sens) => { if (test.test(n)) L.push([terme, sens]); };
  const jeuPlusBonus = estJeuPlusBonus(p);
  if (jeuPlusBonus) L.push(['+ Pre-order Bonus DLC', 'Le jeu complet, avec en plus le bonus offert aux précommandes (objets dans le jeu)']);
  else a(/pre-?order bonus/, 'Pre-order Bonus', 'Bonus offert à ceux qui précommandent le jeu (tenue, arme, objets...)');
  a(/pre-?order(?! bonus)/, 'Pre-order', 'Précommande : le jeu n\'est pas encore sorti, le code fonctionnera à la date de sortie');
  if (!jeuPlusBonus) a(/\bdlc\b/, 'DLC', 'Contenu additionnel pour un jeu. Le jeu de base est obligatoire et vendu à part');
  a(/season pass/, 'Season Pass', 'Accès aux futurs contenus additionnels du jeu');
  a(/\bupgrade\b/, 'Upgrade', 'Passage à une édition supérieure du jeu, qu\'il faut déjà posséder');
  a(/deluxe|gold edition|ultimate|complete edition|premium edition|vault edition/, 'Deluxe / Gold / Ultimate…', 'Édition plus complète du jeu, avec des bonus inclus');
  a(/\bbundle\b/, 'Bundle', 'Lot de plusieurs produits vendus ensemble');
  a(/gift card|giftcard|prepaid/, 'Gift Card / Prepaid', 'Carte de crédit à ajouter au porte-monnaie de votre compte');
  a(/steam gift/, 'Steam Gift', 'Le produit vous est offert via Steam (lien ou invitation) au lieu d\'un code');
  a(/cd key|\bkey\b/, 'CD Key / Key', 'Code d\'activation, envoyé par email, à saisir sur la boutique officielle');
  a(/\bps5\b/, 'PS5', 'Pour PlayStation 5');
  a(/\bps4\b/, 'PS4', 'Pour PlayStation 4');
  a(/\bpsn\b|playstation network/, 'PSN', 'Compte PlayStation (PlayStation Network)');
  a(/xbox series/, 'Xbox Series X|S', 'Pour Xbox Series X et Series S');
  a(/xbox one/, 'Xbox One', 'Pour Xbox One');
  a(/\bswitch\b/, 'Switch', 'Pour Nintendo Switch');
  a(/\bpc\b|\bsteam\b(?! gift)/, 'PC / Steam', 'Pour ordinateur, via l\'application Steam');
  const region = regionDepuisNom(p.nom);
  if (!/^Indiquée/.test(region)) L.push(['Région', region + ' : le code doit être activé sur un compte de cette région']);
  return L;
}

(async () => {
  const r = await fetch('/.netlify/functions/get-config');
  const c = await r.json();
  sb = supabase.createClient(c.surl, c.skey);

  if (!prodId) { render404(); return; }

  const { data: brut } = await sb.from('products').select('*').eq('id', prodId).single();
  if (!brut) { render404(); return; }
  const p = appliquerPromo(brut);
  produit = p;
  document.title = p.nom + ' — BabiPlay CI';

  // On ne charge que les produits de la même plateforme (au lieu du catalogue entier,
  // 4000+ produits) : c'est le seul sous-ensemble utilisé pour "Autres éditions" et
  // "Produits similaires" plus bas. Une seule petite requête au lieu de 5 requêtes de 1000 lignes.
  const { data: rel, error: relErr } = await sb.from('products')
    .select('id, nom, prix, image_url, plateforme, sous_categorie')
    .eq('est_actif', true).eq('plateforme', p.plateforme).neq('id', prodId).limit(40);
  if (relErr) console.error('Erreur chargement produits similaires:', relErr.message);
  allProducts = rel || [];
  renderPage();
})();

  const specsRows = [
    ['Type de produit', LIBELLE_TYPE[type]],
    [type === 'physique' ? 'Livraison' : 'Région de validité', type === 'physique' ? `Abidjan — environ ${delai} jours` : regionDepuisNom(p.nom)],

    ['Éditeur', p.editeur],

    <div class="info-box">

    <div class="info-box">
      <h3>📦 Autres montants / éditions</h3>
      <div class="sim-grid">
        ${editions.map(e => `
          <a class="sim-card" href="produit.html?id=${e.id}">

  const similairesHtml = similaires.length > 0 ? `

      <div class="sim-grid">

              : `<div class="sim-card-fb ${pFbClass(s.plateforme)}">${pEmoji(s.plateforme)}</div>`}

    </div>` : '';

  document.getElementById('page-content').innerHTML = `
    <!-- HERO -->
    <div class="hero">
      <div class="hero-content">
        <span class="hero-plat" style="background:rgba(0,0,0,.3);border:1px solid ${color};color:${color}">${pEmoji(p.plateforme)} ${pLabel(p.plateforme)}</span>
        <div class="hero-title">${p.nom}</div>
        <div class="hero-meta">
          <span>${LIBELLE_TYPE[type]}</span>
          ${p.categorie ? `<span>·</span><span>${p.categorie}</span>` : ''}

    </div>

    <!-- LAYOUT -->
    <div class="product-layout">
      <!-- GALERIE -->
      <div class="layout-galerie">
        ${imgHtml}
      </div>

      <!-- ACHAT -->
      <div class="layout-achat">
        <div class="buy-box">
          ${galerie.length ? `<img src="${galerie[0]}" alt="${p.nom}" class="buy-img">` : `<div class="buy-img-fb ${pFbClass(p.plateforme)}">${pEmoji(p.plateforme)}</div>`}
          <div class="buy-name">${p.nom}</div>
          <div class="buy-type">${LIBELLE_TYPE[type]}</div>
          <div>
            ${p.prix_normal ? `<div class="buy-promo"><s>${fmt(p.prix_normal)} FCFA</s><span>-${p.promo_pct} %</span></div>` : ''}
            <div class="buy-price">${fmt(p.prix)} <small>FCFA</small></div>

          </div>
          <div class="buy-stock"><div class="buy-stock-dot"></div> ${type === 'physique' ? `En stock — livraison sous ${delai} jours` : p.est_precommande ? `Précommande — code livré le jour de la sortie${dateSortieFR(p) ? ' (' + dateSortieFR(p) + ')' : ''}` : 'En stock — livraison immédiate'}</div>

// PROMO : même règle que la base (le vrai prix est recalculé au paiement)
function appliquerPromo(p) {
  const active = p.prix_promo && p.promo_fin && new Date(p.promo_fin) > new Date() && p.prix_promo > 0 && p.prix_promo < p.prix;
  if (!active) return p;
  return { ...p, prix_normal: p.prix, prix: p.prix_promo, promo_pct: Math.round((1 - p.prix_promo / p.prix) * 100) };
}
// Compte à rebours en direct ; à zéro, on recharge pour afficher le prix normal
setInterval(() => {
  const el = document.getElementById('buy-chrono');
  if (!el) return;
  const ms = new Date(el.dataset.fin) - new Date();
  if (ms <= 0) { location.reload(); return; }
  const j = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), sec = Math.floor(ms % 6e4 / 1e3);
  const pad = n => String(n).padStart(2, '0');
  el.textContent = `⚡ Promo : fin dans ${j ? j + ' j ' : ''}${pad(h)}:${pad(m)}:${pad(sec)}`;
}, 1000);

function addToCart() {
  showToast('✅ Ajouté au panier !', 'ok');
  // Redirige vers accueil avec le produit dans le panier
  sessionStorage.setItem('add_to_cart', prodId);
  window.location.href = 'index.html?cart=1';
}

function render404() {
  document.getElementById('page-content').innerHTML = `
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:12px">😕</div>
      <h2 style="font-family:'Rajdhani',sans-serif;font-size:22px;margin-bottom:8px">Produit introuvable</h2>
      <p style="color:var(--muted2);margin-bottom:20px">Ce produit n'existe pas ou a été retiré.</p>
      <a href="index.html" style="background:var(--gold);color:#000;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:700;font-family:'Rajdhani',sans-serif">← Retour à l'accueil</a>
    </div>`;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2800);
}
